[package]
name = "writer"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.7"
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ulid = "3"
notify = "8"
futures = "0.3"

[dev-dependencies]
serde_json = "1"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3
