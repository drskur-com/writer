[package]
name = "writer"
version = "0.1.0"
edition = "2024"

[dependencies]
# tree-sitter-*: 에디터 펜스 코드 블록 하이라이팅. markdown 문법이 펜스를 찾고 안쪽을 각 언어 문법에 넘긴다.
gpui-kit = { version = "0.8", features = [
    "tree-sitter",
    "tree-sitter-markdown",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-python",
    "tree-sitter-java",
    "tree-sitter-bash",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-sql",
    "tree-sitter-diff",
] }
# 하이라이터에 편집 내용(`InputEdit`)을 넘길 때 쓴다. 버전은 gpui-component와 맞춘다.
tree-sitter = "0.26"
# `LineStyle`처럼 gpui-kit이 다시 내보내지 않는 타입용. 버전은 gpui-kit과 맞춘다.
gpui-base = "0.8"
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ulid = "3"
notify = "8"
futures = "0.3"
markdown = "1"
trash = "5"
imagesize = "0.14"
# 썸네일 프레임(`gpui::RenderImage`)과 macOS 밖의 썸네일 대체 경로. 버전은 gpui와 맞춘다.
image = "0.25"
zip = { version = "2", default-features = false, features = ["deflate"] }
# PDF 내보내기(ADR-0014): 쓰기, 시스템 서체 찾기, 글자 유무·폭 확인.
krilla = "0.8"
fontdb = "0.23"
ttf-parser = "0.25"
# 웹 주소 이미지 읽기·내려받기용 HTTP 클라이언트. 버전은 gpui(gpui-pre)와 맞춘다.
reqwest_client = { version = "=0.3.9", package = "gpui-pre-reqwest-client" }

# 번들 없이 실행할 때(`cargo run`)도 Dock에 앱 아이콘을 보인다. 버전은 gpui가 쓰는 것과 맞춘다.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
# 썸네일은 Finder와 같은 QuickLook으로 만든다(이미지·동영상, 시스템 캐시).
objc2-quick-look-thumbnailing = { version = "0.3", features = ["QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGContext", "CGBitmapContext", "CGColorSpace"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
block2 = "0.6"

# `cargo bundle --release`로 .app을 만든다.
[package.metadata.bundle]
name = "Writer"
identifier = "com.drskur.writer"
icon = ["resources/icon/writer.icns", "resources/icon/writer.png"]
category = "public.app-category.productivity"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3

# 제목 줄 확대를 위한 gpui-base 패치(PLAN §1.4).
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
