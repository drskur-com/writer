[tools]
rust = "latest"
sccache = "latest"
"cargo:cargo-watch" = "latest"
cmake = "latest"

[env]
# transcribe.cpp(ggml) C++ 소스의 UTF-8 주석을 한국어 Windows 기본 코드페이지(949)로 읽으면
# 주석 끝의 multibyte 문자가 개행을 삼켜 문법 오류가 난다. MSVC에 UTF-8 소스임을 알려 준다.
CL = "-utf-8"

# Vulkan SDK(transcribe-cpp의 vulkan·dynamic-backends 기능). VULKAN_SDK가 이미 있으면 그 값을,
# 없으면 기본 설치 경로를 쓴다. SDK를 다른 버전으로 옮겼다면 아래 기본값만 고치면 된다.
VULKAN_SDK = "{{env.VULKAN_SDK | default(value='C:/VulkanSDK/1.4.363.0')}}"
_.path = ["{{env.VULKAN_SDK}}/Bin"]

[tasks.check]
description = "빠른 타입 체크 (컴파일 X)"
run = "cargo check"

[tasks.dev]
description = "개발 모드 실행"
run = "cargo run"

[tasks.watch]
description = "코드 변경 시 자동 실행"
run = "cargo watch -w src -x run --poll"

[tasks.build-fast]
description = "빠른 증분 빌드"
env = { CARGO_INCREMENTAL = "1" }
run = "cargo build"

[tasks.bundle]
description = "번들 만들기 (target/release/bundle: macOS .app, Windows .msi·.exe)"
# crates.io의 cargo-bundle 대신 vendor/cargo-bundle 사본을 그대로 빌드해 쓴다(Windows 쪽 패치 포함).
# cargo-bundle은 현재 디렉터리의 Cargo.toml을 대상으로 삼으므로 실행 위치는 저장소 루트다.
# 앞쪽 `--release`는 cargo-bundle 자체를, `bundle` 뒤쪽 `--release`는 번들할 Writer를 릴리스로 빌드한다.
# Windows 기본 형식 `msi`(msi 크레이트로 직접 만든다)는 Windows Installer가 열지 못한다(0x80004005,
# 오류 1620). WiX로 만드는 `wxsmsi` 형식을 쓴다. .NET SDK가 있어야 한다(없으면 `winget install Microsoft.DotNet.SDK.8`).
run = "cargo run --locked --release --manifest-path vendor/cargo-bundle/Cargo.toml -- bundle --release --format wxsmsi"

[tasks.clean-cache]
description = "sccache 통계 확인"
run = "sccache --show-stats"
