[package]
edition = "2024"
name = "cargo-bundle"
version = "0.12.0"
authors = ["George Burton <burtonageo@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Wrap rust executables in OS-specific app bundles"
readme = "Readme.md"
keywords = [
    "bundle",
    "cargo",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/burtonageo/cargo-bundle"

[package.metadata.bundle.example.goodbye]
name = "Goodbye"
identifier = "io.github.burtonageo.cargo-bundle.goodbye"
icon = [
    "examples/goodbye/icon32x32.png",
    "examples/goodbye/icon128x128.png",
]
category = "Developer Tool"
short_description = "An example CLI application showing PNG icon bundling"
long_description = """
A simple command-line application that demonstrates bundling a Rust binary
with PNG icons using cargo-bundle.
"""
appimage_metainfo_path = "examples/goodbye/goodbye.metainfo.xml"

[package.metadata.bundle.example.goodbye.linux.localizations.fr]
Name = "Au revoir"
Comment = "Une application CLI d'exemple montrant l'empaquetage d'icônes PNG"

[package.metadata.bundle.example.goodbye.linux.localizations.de]
Name = "Auf Wiedersehen"
Comment = "Eine Beispiel-CLI-Anwendung für das Bündeln von PNG-Symbolen"

[package.metadata.bundle.example.hello]
name = "hello"
identifier = "io.github.burtonageo.cargo-bundle.hello"
icon = [
    "examples/hello/icon.svg",
    "examples/hello/icon*.png",
]
category = "Utility"
short_description = "An example of a bundled application"
long_description = """
A trivial application that just displays a blank window with
a title bar.  It serves as an example of an application that
can be bundled with cargo-bundle, as well as a test-case for
cargo-bundle's support for bundling crate examples.
"""

[package.metadata.bundle.example.hello.osx]
dmg_background = "examples/hello/dmg-background.svg"

[features]
windows-signing = ["dep:osslsigncode"]

[[bin]]
name = "cargo-bundle"
path = "src/main.rs"

[[example]]
name = "goodbye"
path = "examples/goodbye/main.rs"

[[example]]
name = "hello"
path = "examples/hello/main.rs"

[[test]]
name = "common"
path = "tests/common.rs"

[[test]]
name = "goodbye"
path = "tests/goodbye.rs"

[[test]]
name = "hello"
path = "tests/hello.rs"

